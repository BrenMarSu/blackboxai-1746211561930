<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Encuesta de Opinión - Página Principal</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>
<body class="bg-gradient-to-b from-blue-100 to-white min-h-screen flex flex-col items-center justify-center p-6">
  <div class="bg-white rounded-3xl shadow-xl max-w-lg w-full p-8 flex flex-col items-center">
    <img src="https://cdn-icons-png.flaticon.com/512/2917/2917993.png" alt="Encuesta Icon" class="w-24 h-24 mb-6" />
    <h1 class="text-4xl font-semibold text-blue-700 mb-4 text-center">Encuesta de Opinión</h1>
    <p class="text-center text-gray-600 mb-8 px-4">Queremos conocer tu opinión para mejorar nuestro servicio. ¡Gracias por participar!</p>
    <form class="w-full space-y-6">
      <div>
        <label class="block text-gray-800 font-semibold mb-2" for="question1">¿Cómo calificarías nuestro servicio?</label>
        <select id="question1" name="question1" class="w-full border border-blue-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
          <option value="" disabled selected>Selecciona una opción</option>
          <option value="excelente">Excelente</option>
          <option value="bueno">Bueno</option>
          <option value="regular">Regular</option>
          <option value="malo">Malo</option>
        </select>
      </div>
      <div>
        <label class="block text-gray-800 font-semibold mb-2" for="question2">¿Qué mejorarías?</label>
        <textarea id="question2" name="question2" rows="4" class="w-full border border-blue-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500 transition" placeholder="Escribe tu opinión aquí..."></textarea>
      </div>
      <div class="flex justify-center">
        <button type="submit" class="bg-blue-600 text-white font-semibold px-8 py-3 rounded-full hover:bg-blue-700 transition shadow-lg">Enviar</button>
      </div>
    </form>
  </div>
</body>
</html>
